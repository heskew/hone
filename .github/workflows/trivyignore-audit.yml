name: Audit Trivyignore

on:
  schedule:
    # Weekly check (Mondays 10am UTC, after docker build)
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit-trivyignore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Scan the published image with NO ignore file, so ignored CVEs show up
      # with their current fix status
      - name: Scan published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/hone-money:latest
          format: 'json'
          output: 'scan.json'
          exit-code: '0'

      - name: Check ignored CVEs against scan
        id: check-cves
        run: |
          set -e

          CVES=$(grep -oE '^CVE-[0-9]+-[0-9]+' .trivyignore || true)

          if [ -z "$CVES" ]; then
            echo "No CVEs found in .trivyignore"
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FIXED_CVES=""
          STALE_CVES=""

          for CVE in $CVES; do
            COUNT=$(jq -r --arg cve "$CVE" \
              '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == $cve)] | length' scan.json)

            if [ "$COUNT" = "0" ]; then
              echo "○ $CVE no longer present in image (stale ignore entry)"
              STALE_CVES="$STALE_CVES $CVE"
              continue
            fi

            FIX=$(jq -r --arg cve "$CVE" \
              '[.Results[]?.Vulnerabilities[]? | select(.VulnerabilityID == $cve) | .FixedVersion // empty] | map(select(. != "")) | first // empty' scan.json)

            if [ -n "$FIX" ]; then
              echo "✓ $CVE has a fix available: $FIX"
              FIXED_CVES="$FIXED_CVES $CVE"
            else
              echo "✗ $CVE still present, no fix available"
            fi
          done

          if [ -n "$FIXED_CVES" ] || [ -n "$STALE_CVES" ]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
            echo "fixed_cves=$FIXED_CVES" >> "$GITHUB_OUTPUT"
            echo "stale_cves=$STALE_CVES" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update issue
        if: steps.check-cves.outputs.has_findings == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fixedCves = '${{ steps.check-cves.outputs.fixed_cves }}'.trim().split(' ').filter(Boolean);
            const staleCves = '${{ steps.check-cves.outputs.stale_cves }}'.trim().split(' ').filter(Boolean);

            let body = '## .trivyignore Audit Findings\n\n';

            if (fixedCves.length) {
              body += `### Fixes Now Available

            These CVEs are still present in the image but now have fixed versions:

            ${fixedCves.map(cve => `- ${cve}`).join('\n')}

            Update the base image in \`Dockerfile.release\`, rebuild, then remove them from \`.trivyignore\`.

            `;
            }

            if (staleCves.length) {
              body += `### Stale Entries

            These CVEs no longer appear in the image scan at all — remove them from \`.trivyignore\`:

            ${staleCves.map(cve => `- ${cve}`).join('\n')}

            `;
            }

            body += '\nThis issue was automatically created by the trivyignore-audit workflow.';

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,trivyignore'
            });

            const existingIssue = issues.data.find(i => i.title.includes('.trivyignore audit'));

            if (existingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated issue #${existingIssue.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 .trivyignore audit: entries need attention',
                body: body,
                labels: ['security', 'trivyignore']
              });
              console.log('Created new issue');
            }
